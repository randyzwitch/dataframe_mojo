name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Run tests
        run: pixi run test

      - name: Check public docstrings
        run: pixi run docs-check

      - name: Build package and run an example against it
        run: pixi run package-smoke

      - name: Generate API reference
        run: pixi run docs

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk '/^## Unreleased/{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/dataframe.mojoc docs/api.md LICENSE THIRD_PARTY_NOTICES.md \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
