name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Install independent format consumers
        run: |
          pixi install --locked -e oracle
          pixi run --locked -e oracle python3 -c 'import geopandas, pyproj, pyarrow, shapely'

      - uses: ./.github/actions/setup-parquet

      - name: Verify native Parquet exported ABI
        run: pixi run check-parquet-abi

      - name: Run maintained contract suite
        run: pixi run test --output build/contract-tests

      - name: Validate actual contract outputs with independent format consumers
        run: pixi run -e oracle test-interchange-oracles

      - name: Check public docstrings
        run: pixi run docs-check

      - name: Build examples
        run: pixi run build

      - name: Build package and run an example against it
        run: pixi run package-smoke

      - name: Generate API reference
        run: pixi run docs

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk '/^## Unreleased/{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/dataframe.mojoc docs/api.md LICENSE THIRD_PARTY_NOTICES.md \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
