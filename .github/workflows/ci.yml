name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos-groups:
        description: Number of macOS unit-test drivers (for measured calibration)
        default: '10'
        type: choice
        options: ['10', '8', '6', '4']
      macos-jobs:
        description: Concurrent macOS compiler processes
        default: '3'
        type: choice
        options: ['3', '2', '1']

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Check formatting
        run: pixi run format-check
      - name: Check release version consistency
        run: pixi run check-version
      - name: Check benchmark separation
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check_benchmark_separation.sh "$BASE_REF"
      - name: Check benchmark report provenance and coverage
        run: pixi run -e oracle python3 tests/test_bench_reports.py
      - name: Check CI runner orchestration
        run: python3 tests/test_ci_runners.py
      - name: Check dtype literals
        run: bash scripts/check_dtype_literals.sh
      - name: Check public docstrings and API reference
        run: |
          pixi run docs
          git diff --exit-code docs/api.md

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      # One cache restore/build per run, even on a cold cache. All Linux
      # consumers use this exact artifact, including on fork PRs.
      - uses: ./.github/actions/setup-parquet
      - uses: actions/upload-artifact@v4
        with:
          name: dfparquet-linux
          path: build/dfparquet/libdfparquet.so
          if-no-files-found: error
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-native-linux

  unit-linux:
    needs: native-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: dfparquet-linux
          path: build/dfparquet
      - name: Verify Parquet exports and loader search paths
        run: python3 scripts/ci_time.py --label parquet-loader -- pixi run bash scripts/check_parquet_library.sh build/ci-tests/test_parquet
      # Keep the measured Linux memory bound: two grouped programs, serial.
      - name: Run tests
        env:
          TEST_PARQUET_BINARY: build/ci-tests/test_parquet
          TEST_GROUPS: '2'
          TEST_JOBS: '1'
        run: python3 scripts/ci_time.py --label unit-tests --budget-seconds 2400 -- pixi run test
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-unit-linux

  unit-macos:
    # Preserve the existing branch-protection check name.
    name: test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - uses: ./.github/actions/setup-parquet
      - name: Verify Parquet exports and loader search paths
        run: python3 scripts/ci_time.py --label parquet-loader -- pixi run bash scripts/check_parquet_library.sh build/ci-tests/test_parquet
      - name: Run tests
        env:
          TEST_PARQUET_BINARY: build/ci-tests/test_parquet
          TEST_GROUPS: ${{ inputs.macos-groups || '10' }}
          TEST_JOBS: ${{ inputs.macos-jobs || '3' }}
        run: python3 scripts/ci_time.py --label unit-tests --budget-seconds 3300 -- pixi run test
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-unit-macos

  oracles:
    needs: native-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: dfparquet-linux
          path: build/dfparquet
      - name: Differential tests against Polars
        env:
          ORACLE_SEED: ${{ github.run_number }}
        run: python3 scripts/ci_time.py --label oracles --budget-seconds 1500 -- bash scripts/ci_oracles.sh
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-oracles

  answers:
    needs: native-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: development
            suites: h2o_groupby,h2o_join,pdsh
          - name: tpcds
            suites: tpcds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: dfparquet-linux
          path: build/dfparquet
      - name: Query answers (smoke scale)
        env:
          SUITES: ${{ matrix.suites }}
        run: >-
          python3 scripts/ci_time.py --label query-answers --budget-seconds 900 --
          pixi run -e oracle python3 scripts/bench_suites.py
          --suites "$SUITES" --scale smoke --correctness-only
          --engines mojo,duckdb --threads 4
      - name: Upload query answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-answers-${{ matrix.name }}
          path: build/suites/answers.json
          if-no-files-found: ignore
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-answers-${{ matrix.name }}

  test-linux:
    # Keep the existing required check, now aggregating every Linux check.
    name: test (ubuntu-latest)
    if: always()
    needs: [checks, native-linux, unit-linux, oracles, answers]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Linux checks to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_JSON"]).items()}
          print(results)
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          PY
