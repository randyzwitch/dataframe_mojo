name: Focused macOS oracle validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Install locked independent consumers before tests
        run: pixi install --locked -e oracle
      - name: Require independent consumer imports
        run: pixi run --locked -e oracle python3 -c 'import geopandas, pyproj, pyarrow, shapely'
      - uses: ./.github/actions/setup-parquet
      - name: Verify native Parquet exported ABI
        run: pixi run --locked check-parquet-abi
      - name: Diagnose cached native library with system memory pool
        continue-on-error: true
        env:
          ARROW_DEFAULT_MEMORY_POOL: system
        run: pixi run --locked -e oracle python3 tests/support/native_stream_oracle.py build/dfparquet/libdfparquet.dylib

  oracle-macos-clean:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Install locked independent consumers
        run: pixi install --locked -e oracle
      - name: Build native Parquet library without binary cache
        run: pixi run --locked -e native bash native/dfparquet/build.sh build/dfparquet-clean
      - name: Validate clean native library with default memory pool
        run: pixi run --locked -e oracle python3 tests/support/native_stream_oracle.py build/dfparquet-clean/libdfparquet.dylib
      - name: Validate clean native library with system memory pool
        if: always()
        env:
          ARROW_DEFAULT_MEMORY_POOL: system
        run: pixi run --locked -e oracle python3 tests/support/native_stream_oracle.py build/dfparquet-clean/libdfparquet.dylib
