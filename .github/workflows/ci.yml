name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: pixi run format-check

      - name: Check dtype literals
        if: runner.os == 'Linux'
        run: bash scripts/check_dtype_literals.sh

      - name: Check public docstrings and API reference
        if: runner.os == 'Linux'
        run: |
          pixi run docs
          git diff --exit-code docs/api.md

      - name: Run tests
        run: pixi run test

      # The lower bound of the supported Mojo range (see pixi.toml), so
      # the source keeps compiling on 1.0 as well as 1.1.
      - name: Run tests on the oldest supported Mojo
        if: runner.os == 'Linux'
        run: pixi run -e mojo10 bash scripts/run_tests.sh

      - name: Build examples
        run: pixi run build

      - name: Benchmark smoke test
        if: runner.os == 'Linux'
        run: pixi run bench-smoke

      - name: Differential tests against Polars
        if: runner.os == 'Linux'
        run: |
          pixi run -e oracle oracle --cases 150 --seed ${{ github.run_number }}
          pixi run -e oracle oracle --mutation-check --cases 20
          pixi run -e oracle oracle-arrow

      - name: Package smoke test
        if: runner.os == 'Linux'
        run: pixi run package-smoke
