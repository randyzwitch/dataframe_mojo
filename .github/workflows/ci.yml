name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full run on main: every contract area on both platforms.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Contract areas use the runner's own names (`tests/runner.mojo --help`).
# Each area is one compiled program and compile time dominates (6-13 minutes
# per program on a 64-core machine against 90 seconds of test execution in
# total), so the areas run as parallel jobs rather than one serial job.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Check formatting
        run: pixi run format-check
      - name: Check release version consistency
        run: pixi run check-version
      - name: Check benchmark separation
        if: github.event_name == 'pull_request'
        env:
          # A stacked PR's base branch can be deleted while its run is queued.
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          # Check the PR changes, not unrelated main changes in the test merge.
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_benchmark_separation.sh "$BASE_REF" "$HEAD_REF"
      - name: Check benchmark report provenance and coverage
        run: |
          for t in tests/tooling/test_*.py; do
            pixi run -e oracle python3 "$t"
          done
      - name: Check Mojo test runner
        run: pixi run mojo run -I providers/cpu -I . tests/tooling/test_contract_runner.mojo
      - name: Check dtype literals
        run: bash scripts/check_dtype_literals.sh
      - name: Check public docstrings and API reference
        run: |
          pixi run docs
          git diff --exit-code docs/api.md
      - name: Check no evidence files
        run: bash scripts/check_no_evidence_files.sh
      - name: Check test reachability
        run: python3 scripts/check_test_reachability.py
      - name: Check accelerator boundary
        run: bash scripts/check_accelerator_boundary.sh
      - name: Check lazy query boundaries
        run: python3 scripts/check_lazy_boundaries.py
      - name: Check aggregation boundaries
        run: python3 scripts/check_aggregation_boundaries.py
      - name: Check join boundaries
        run: python3 scripts/check_join_boundaries.py

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      # One cache restore/build per run, even on a cold cache. All Linux
      # consumers use this exact artifact, including on fork PRs.
      - uses: ./.github/actions/setup-parquet
      - name: Verify native Parquet exported ABI
        run: pixi run check-parquet-abi
      - uses: actions/upload-artifact@v6
        with:
          name: dfparquet-linux
          path: build/dfparquet/libdfparquet.so
          if-no-files-found: error
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-native-linux

  unit-linux:
    name: unit-linux (${{ matrix.area }})
    needs: native-linux
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        area: [public, storage, kernels, planner, execution, interchange]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Download native Parquet artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name dfparquet-linux --dir build/dfparquet
      - name: Run contract area
        env:
          AREA: ${{ matrix.area }}
        run: >-
          python3 scripts/ci_time.py --label "contract-$AREA" --budget-seconds 1500 --
          pixi run test-cpu --areas "$AREA" --output build/contract-tests
      - name: Install independent format consumers
        if: matrix.area == 'interchange'
        run: |
          pixi install --locked -e oracle
          pixi run --locked -e oracle python3 -c 'import geopandas, pyproj, pyarrow, shapely'
      - name: Validate actual contract outputs with independent format consumers
        if: matrix.area == 'interchange'
        run: pixi run -e oracle test-interchange-oracles
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-unit-linux-${{ matrix.area }}

  unit-macos:
    name: unit-macos (${{ matrix.area }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the API and file-format areas on macOS; pushes to
        # main, the nightly schedule and manual runs cover every area there.
        area: ${{ fromJSON(github.event_name == 'pull_request' && '["public", "interchange"]' || '["public", "storage", "kernels", "planner", "execution", "interchange"]') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - uses: ./.github/actions/setup-parquet
      - name: Verify native Parquet exported ABI
        if: matrix.area == 'interchange'
        run: pixi run check-parquet-abi
      - name: Run contract area
        env:
          AREA: ${{ matrix.area }}
        run: >-
          python3 scripts/ci_time.py --label "contract-$AREA" --budget-seconds 2400 --
          pixi run test --areas "$AREA" --output build/contract-tests
      - name: Install independent format consumers
        if: matrix.area == 'interchange'
        run: |
          pixi install --locked -e oracle
          pixi run --locked -e oracle python3 -c 'import geopandas, pyproj, pyarrow, shapely'
      - name: Validate actual contract outputs with independent format consumers
        if: matrix.area == 'interchange'
        run: pixi run -e oracle test-interchange-oracles
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-unit-macos-${{ matrix.area }}

  linux-default-build:
    # The Linux contract areas build with the CPU-only provider
    # (`-I providers/cpu`) and never compile the Metal backend. This job is the
    # default build, with the Metal provider: it compiles the backend for a
    # CPU-only target and runs its dispatch checks, so it cannot stop building
    # unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Default (Metal provider) build for a CPU target
        run: >-
          python3 scripts/ci_time.py --label linux-default-build --budget-seconds 1500 --
          pixi run test-metal-cpu-compile

  answers:
    needs: native-linux
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # TPC-DS has been a development suite since 2026-10-15; it keeps its
        # own job only so the two halves run in parallel.
        include:
          - name: development
            suites: h2o_groupby,h2o_join,pdsh
          - name: tpcds
            suites: tpcds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Download native Parquet artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name dfparquet-linux --dir build/dfparquet
      - name: Query answers (smoke scale)
        env:
          SUITES: ${{ matrix.suites }}
        run: >-
          python3 scripts/ci_time.py --label query-answers --budget-seconds 900 --
          pixi run -e oracle python3 benchmarks/tools/bench_suites.py
          --suites "$SUITES" --scale smoke --correctness-only
          --engines mojo,duckdb --threads 4
      - name: Upload query answers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: query-answers-${{ matrix.name }}
          path: build/suites/answers.json
          if-no-files-found: ignore
      - uses: ./.github/actions/ci-timings
        if: always()
        with:
          name: ci-timings-answers-${{ matrix.name }}

  test-linux:
    # The existing check name, aggregating every Linux job.
    name: test (ubuntu-latest)
    if: always()
    needs: [checks, native-linux, unit-linux, linux-default-build, answers]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Linux checks to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_JSON"]).items()}
          print(results)
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          PY

  test-macos:
    # The existing check name, aggregating every macOS area job.
    name: test (macos-latest)
    if: always()
    needs: unit-macos
    runs-on: ubuntu-latest
    steps:
      - name: Require all macOS areas to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_JSON"]).items()}
          print(results)
          sys.exit(0 if all(result == "success" for result in results.values()) else 1)
          PY
