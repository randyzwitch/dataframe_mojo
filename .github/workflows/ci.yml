name: Focused macOS oracle validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Install locked independent consumers before tests
        run: pixi install --locked -e oracle
      - name: Require independent consumer imports
        run: pixi run --locked -e oracle python3 -c 'import geopandas, pyproj, pyarrow, shapely'
      - uses: ./.github/actions/setup-parquet
      - name: Verify native Parquet exported ABI
        run: pixi run --locked check-parquet-abi
      - name: Generate actual Parquet and spatial outputs with maintained contracts
        run: pixi run --locked test --areas interchange --contracts io.parquet io.spatial --output build/contract-tests
      - name: Validate outputs with unchanged independent consumers
        run: pixi run --locked -e oracle test-interchange-oracles
