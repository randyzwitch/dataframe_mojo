name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: pixi run format-check

      - name: Check release version consistency
        if: runner.os == 'Linux'
        run: pixi run check-version

      - name: Check dtype literals
        if: runner.os == 'Linux'
        run: bash scripts/check_dtype_literals.sh

      - name: Check public docstrings and API reference
        if: runner.os == 'Linux'
        run: |
          pixi run docs
          git diff --exit-code docs/api.md

      # tests/test_parquet.mojo skips itself when the reader library is
      # absent, so build it first on Linux and Apple Silicon and verify both
      # loader search paths. The library is cached by the shim's sources; the
      # Arrow version lives in build.sh, so a bump changes the key.
      - name: Restore libdfparquet
        id: dfparquet
        uses: actions/cache@v4
        with:
          path: |
            build/dfparquet/libdfparquet.so
            build/dfparquet/libdfparquet.dylib
          key: dfparquet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/dfparquet/**') }}

      - name: Build libdfparquet
        if: steps.dfparquet.outputs.cache-hit != 'true'
        run: pixi run -e native build-dfparquet

      - name: Verify Parquet exports and loader search paths
        run: pixi run bash scripts/check_parquet_library.sh

      - name: Run tests
        run: pixi run test

      - name: Build examples
        run: pixi run build

      - name: Benchmark smoke test
        if: runner.os == 'Linux'
        run: pixi run bench-smoke

      - name: Differential tests against Polars
        if: runner.os == 'Linux'
        run: |
          pixi run -e oracle oracle --cases 150 --seed ${{ github.run_number }}
          pixi run -e oracle oracle --mutation-check --cases 20
          pixi run -e oracle oracle-arrow

      - name: Package smoke test
        if: runner.os == 'Linux'
        run: pixi run package-smoke
