name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The benchmark-separation check diffs against the PR's base.
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: pixi run format-check

      - name: Check release version consistency
        if: runner.os == 'Linux'
        run: pixi run check-version

      - name: Check benchmark separation
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: bash scripts/check_benchmark_separation.sh origin/${{ github.base_ref }}

      - name: Check benchmark report provenance and coverage
        if: runner.os == 'Linux'
        run: pixi run -e oracle python3 tests/test_bench_reports.py

      - name: Check dtype literals
        if: runner.os == 'Linux'
        run: bash scripts/check_dtype_literals.sh

      - name: Check public docstrings and API reference
        if: runner.os == 'Linux'
        run: |
          pixi run docs
          git diff --exit-code docs/api.md

      # tests/test_parquet.mojo skips itself when the reader library is
      # absent, so build it first on Linux and Apple Silicon and verify both
      # loader search paths. The library is cached by the shim's sources; the
      # Arrow version lives in build.sh, so a bump changes the key.
      - name: Restore libdfparquet
        id: dfparquet
        uses: actions/cache@v6
        with:
          path: |
            build/dfparquet/libdfparquet.so
            build/dfparquet/libdfparquet.dylib
          key: dfparquet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/dfparquet/**') }}

      - name: Build libdfparquet
        if: steps.dfparquet.outputs.cache-hit != 'true'
        run: pixi run -e native build-dfparquet

      - name: Verify Parquet exports and loader search paths
        run: pixi run bash scripts/check_parquet_library.sh

      # The Linux runner has 16 GB. With the default 10 driver programs,
      # four of them compiling at once peaked at 18 GB and the runner was
      # killed (exit 143, no test output). 24 smaller programs peak at
      # 13 GB. macOS runs three at a time and stays under its limit.
      - name: Run tests
        env:
          TEST_GROUPS: ${{ runner.os == 'Linux' && '24' || '10' }}
        run: pixi run test

      - name: Build examples
        run: pixi run build

      - name: Benchmark smoke test
        if: runner.os == 'Linux'
        run: pixi run bench-smoke

      - name: Differential tests against Polars
        if: runner.os == 'Linux'
        run: |
          pixi run -e oracle oracle --cases 150 --seed ${{ github.run_number }}
          pixi run -e oracle oracle --mutation-check --cases 20
          pixi run -e oracle oracle-arrow
          pixi run -e oracle python3 scripts/check_parquet_write.py
          pixi run -e oracle python3 scripts/check_parquet_stream.py build/dfparquet/libdfparquet.so

      - name: Benchmark suite answers (smoke scale)
        if: runner.os == 'Linux'
        run: >-
          pixi run -e oracle python3 scripts/bench_suites.py
          --suites h2o_groupby,h2o_join,pdsh --scale smoke --rounds 1 --reps 1
          --engines mojo,duckdb --threads 4 --allow-busy --check

      - name: TPC-DS answers (smoke scale)
        if: runner.os == 'Linux'
        run: >-
          pixi run -e oracle python3 scripts/bench_suites.py
          --suites tpcds --scale smoke --rounds 1 --reps 1
          --engines mojo,duckdb --threads 4 --allow-busy --check

      - name: Package smoke test
        if: runner.os == 'Linux'
        run: pixi run package-smoke
