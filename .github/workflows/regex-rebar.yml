name: Regex rebar comparison

on:
  pull_request:
    paths:
      - benchmarks/regex_rebar_runner.mojo
      - benchmarks/tools/bench_regex_rebar.py
      - .github/workflows/regex-rebar.yml
  workflow_dispatch:
    inputs:
      baseline:
        description: Frozen parent engine commit
        required: true
      candidate:
        description: Frozen candidate engine commit
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Fetch pinned upstream workload definitions and data
        run: |
          git clone https://github.com/BurntSushi/rebar.git build/rebar-upstream
          git -C build/rebar-upstream checkout 463d00f31887e84c38467805b9e3122c314b9521
      - name: Compare frozen engines on an isolated runner
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          INPUT_BASELINE: ${{ inputs.baseline }}
          INPUT_CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Stack this benchmark-only PR on the engine PR being measured.
            candidate_ref="$BASE_COMMIT"
            baseline_ref="$(git rev-parse "$candidate_ref^")"
          else
            baseline_ref="$INPUT_BASELINE"
            candidate_ref="$INPUT_CANDIDATE"
          fi
          pixi run -e oracle python3 benchmarks/tools/bench_regex_rebar.py \
            --rebar-dir build/rebar-upstream \
            --baseline "$baseline_ref" --candidate "$candidate_ref"
      - name: Publish comparison summary
        if: always()
        run: |
          if [ -f build/regex-rebar/results.md ]; then
            cat build/regex-rebar/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: regex-rebar-comparison
          path: |
            build/regex-rebar/results.json
            build/regex-rebar/results.md
          if-no-files-found: warn
