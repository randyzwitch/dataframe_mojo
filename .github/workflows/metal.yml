name: Mojo Metal

on:
  pull_request:
    paths:
      - '.github/workflows/metal.yml'
      - 'dataframe/**'
      - 'tests/execution_modes/test_backend*.mojo'
      - 'tests/execution_modes/test_mojo_gpu*.mojo'
      - 'tests/support/**'
      - 'tests/tooling/**'
      - 'tests/runner.mojo'
      - 'tests/run_tests.sh'
      - 'pixi.toml'
      - 'pixi.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/metal.yml'
      - 'dataframe/**'
      - 'tests/execution_modes/test_backend*.mojo'
      - 'tests/execution_modes/test_mojo_gpu*.mojo'
      - 'tests/support/**'
      - 'tests/tooling/**'
      - 'tests/runner.mojo'
      - 'tests/run_tests.sh'
      - 'pixi.toml'
      - 'pixi.lock'
  workflow_dispatch:

concurrency:
  group: metal-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Run Mojo provider contracts with explicit hardware capability
        run: |
          mkdir -p build/contract-tests
          pixi run mojo build -I . tests/tooling/metal_available.mojo -o build/contract-tests/metal-available
          capability="$(build/contract-tests/metal-available)"
          if [[ "$capability" == available ]]; then
            pixi run test --areas execution --contracts execution.backends --capabilities metal
            pixi run --locked -e gpu test-mojo-gpu
            pixi run --locked -e gpu test-mojo-gpu-floating
            pixi run --locked -e gpu test-mojo-gpu-decimal
            pixi run --locked -e gpu test-mojo-gpu-integer
          elif [[ "$capability" == absent ]]; then
            echo "Metal device unavailable; GPU execution reports SKIP(capability); metadata contracts still run."
            pixi run test --areas execution --contracts execution.backends
          else
            echo "Unexpected Metal capability probe result: $capability" >&2
            exit 1
          fi
