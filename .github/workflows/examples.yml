name: Examples

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - 'dataframe/**'
      - 'dataframe_provider/**'
      - 'dataframe_metal/**'
      - 'examples/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'providers/cpu/**'
      - 'recipe/**'
      - 'scripts/build_package.py'
      - 'scripts/build_identity.py'
      - 'scripts/metal_build_identity.py'
      - 'tests/tooling/pixi_git_smoke.sh'
      - '.github/workflows/examples.yml'
      - '.github/actions/setup-pixi/**'

concurrency:
  group: examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pixi
      - name: Build examples
        run: pixi run build
      - name: Smoke test the Git package from a fresh Pixi workspace
        run: bash tests/tooling/pixi_git_smoke.sh "file://$PWD" "$(git rev-parse HEAD)"
