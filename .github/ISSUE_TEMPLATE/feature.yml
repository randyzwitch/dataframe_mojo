name: Feature request
description: A feature Polars or DuckDB has and this library lacks
labels: ["api-parity"]
body:
  - type: input
    id: polars
    attributes:
      label: Polars name
      description: The Polars function, method or option.
      placeholder: Expr.rolling_median
  - type: input
    id: duckdb
    attributes:
      label: DuckDB name
      description: The DuckDB function, SQL syntax or option.
      placeholder: median() OVER (...)
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What you are trying to do and why the current API does not do it.
    validations:
      required: true
