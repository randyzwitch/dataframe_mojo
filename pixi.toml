[workspace]
name = "dataframe_mojo"
version = "0.2.0"
description = "An experimental dataframe library for Mojo"
channels = [
    "https://conda.modular.com/max-nightly",
    "https://conda.modular.com/max",
    "conda-forge",
    "https://prefix.dev/pixi-build-backends",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

# Installable as a Mojo package straight from GitHub. Consumers add, for
# example:
#
#     [dependencies]
#     dataframe_mojo = { git = "https://github.com/randyzwitch/dataframe_mojo.git", tag = "v0.2.0" }
#     mojo = ">=1.2,<1.3"
#
# and then `from dataframe import DataFrame, col`.
#
# A compiled Mojo package only loads in the Mojo version that produced it,
# and pixi builds this package with the newest Mojo its host dependency
# allows -- not with whatever the consumer pinned. From 0.2.0 this package
# is Mojo 1.2 only. 1.2 is a nightly series today, so the bound names the
# nightly this release was built and tested against.
[package]
name = "dataframe_mojo"
version = "0.2.0"
description = "An experimental dataframe library for Mojo"
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = ">=0.2.7,<1" }
source = { path = "." }

[package.build.config.pkg]
name = "dataframe"
path = "dataframe"

[package.host-dependencies]
mojo = ">=1.2.0,<1.3"
max-core = "==26.7.0"

[package.run-dependencies]
mojo = ">=1.2.0,<1.3"
max-core = "==26.7.0"

[dependencies]
# What CI runs, matching the package's host and run dependencies above.
mojo = ">=1.2.0,<1.3"
# Mojo's GPU APIs live in max-core. Package/doc compilation resolves these
# imports even for CPU execution, so every environment needs the matching SDK.
max-core = "==26.7.0"

[tasks]
test = "bash tests/run_tests.sh"
# The same suite built with the CPU-only provider: no GPU code is compiled.
test-cpu = "bash tests/run_tests.sh --provider cpu"
test-interchange-oracles = "mojo run -I . tests/tooling/interchange_oracles.mojo build/contract-tests"
check-version = "python3 scripts/check_version.py"
example = "mojo run -I . examples/sales.mojo && mojo run -I . examples/expressions.mojo && mojo run -I . examples/read_csv.mojo"
format = "mblack --target-version mojo --line-length 80 dataframe dataframe_metal dataframe_provider providers tests examples benchmarks"
format-check = "mblack --check --target-version mojo --line-length 80 dataframe dataframe_metal dataframe_provider providers tests examples benchmarks"
build = "mkdir -p build && mojo build -I . examples/sales.mojo -o build/sales && mojo build -I . examples/expressions.mojo -o build/expressions && mojo build -I . examples/read_csv.mojo -o build/read_csv"
bench-csv = "mojo run -I . benchmarks/bench_csv.mojo"
package = "python3 scripts/build_package.py --output dist"
test-metal-cpu-compile = "mkdir -p build && mojo build --target-accelerator=unknown -I . tests/tooling/mojo_gpu_cpu_compile.mojo -o build/cpu-compile && build/cpu-compile"
check-parquet-abi = "mojo run -I . tests/tooling/check_parquet_abi.mojo"
package-smoke = "bash tests/tooling/package_smoke.sh"
docs = "mkdir -p build && mojo doc -I providers/cpu -I . dataframe -o build/api.json && python3 scripts/api_docs.py build/api.json docs/api.md"
docs-check = "mkdir -p build && mojo doc -I providers/cpu -I . dataframe -o build/api.json && python3 scripts/api_docs.py build/api.json --check"

[feature.oracle.dependencies]
polars = ">=2.0"
pyarrow = ">=15"
python = ">=3.11"
# Use compiled PROJ packages: pyproj's macOS wheels require a newer OS than
# the supported macOS 13 baseline, otherwise GeoPandas triggers a source build.
pyproj = ">=3.5,<4"

[feature.oracle.tasks]
bench-suites = "python3 benchmarks/tools/bench_suites.py"
report-apple = "bash benchmarks/tools/report_apple.sh"
report-apple-quick = { cmd = "bash benchmarks/tools/report_apple.sh", env = { APPLE_SCALE = "smoke", APPLE_ROUNDS = "1" } }
report-cpu = "mkdir -p build/reports/cpu && python3 benchmarks/tools/bench_suites.py --tier full --all-suites --output build/reports/cpu/results.json"
report-cpu-quick = "mkdir -p build/reports/cpu && python3 benchmarks/tools/bench_suites.py --tier quick --output build/reports/cpu/results.json"

[feature.oracle.pypi-dependencies]
duckdb = ">=2.0, <3"
geopandas = ">=1.1, <2"
shapely = ">=2.1, <3"

# Builds libdfparquet, the Parquet reader library read_parquet loads at run
# time (see native/dfparquet). Needs a C++20 compiler on the host.
[feature.native.dependencies]
cmake = ">=3.25"
ninja = ">=1.11"

[feature.native.tasks]
build-dfparquet = "bash native/dfparquet/build.sh build/dfparquet"

[environments]
oracle = { features = ["oracle"], solve-group = "default" }
native = { features = ["native"], solve-group = "default" }
gpu = { features = ["gpu"] }

[feature.gpu]
platforms = ["osx-arm64"]

[feature.gpu.tasks]
test-mojo-gpu-floating = "python3 tests/tooling/mojo_gpu_floating.py"
test-mojo-gpu = "mojo run -I . tests/tooling/mojo_gpu_rows.mojo"
test-mojo-gpu-decimal = "python3 tests/tooling/mojo_gpu_decimal_probe.py"
test-mojo-gpu-integer = "mkdir -p build/contract-tests && python3 tests/tooling/mojo_gpu_integer_probe.py build/contract-tests/integers.bin && mojo run -I . tests/tooling/mojo_gpu_integer_probe.mojo build/contract-tests/integers.bin"
test-mojo-gpu-grouping = "mojo run -I . tests/tooling/mojo_gpu_hash_grouping.mojo && mojo run -I . tests/tooling/mojo_gpu_group_integer.mojo"
test-mojo-gpu-kernels = "mojo run -I . tests/tooling/mojo_gpu_moments_probe.mojo && mojo run -I . tests/tooling/mojo_gpu_statistics_probe.mojo && mojo run -I . tests/tooling/mojo_gpu_quantiles_probe.mojo && mojo run -I . tests/tooling/mojo_gpu_partition_schedule_probe.mojo && mojo run -I . tests/tooling/mojo_gpu_wide_integer_kernels.mojo"
test-metal-suite-checks = { cmd = "mkdir -p build/answer-probe && mojo run -I . -I benchmarks tests/tooling/mojo_cpu_metal_suite_diagnostics_probe.mojo && mojo run -I . -I benchmarks tests/tooling/mojo_cpu_metal_answer_exports_probe.mojo", env = { DATAFRAME_BENCH_ANSWER_EXPORT_PREFIX = "build/answer-probe/answer" } }
