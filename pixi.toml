[workspace]
name = "dataframe_mojo"
version = "0.2.0"
description = "An experimental dataframe library for Mojo"
channels = [
    "https://conda.modular.com/max-nightly",
    "https://conda.modular.com/max",
    "conda-forge",
    "https://prefix.dev/pixi-build-backends",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

# Installable as a Mojo package straight from GitHub. Consumers add, for
# example:
#
#     [dependencies]
#     dataframe_mojo = { git = "https://github.com/randyzwitch/dataframe_mojo.git", tag = "v0.2.0" }
#     mojo = ">=1.2,<1.3"
#
# and then `from dataframe import DataFrame, col`.
#
# A compiled Mojo package only loads in the Mojo version that produced it,
# and pixi builds this package with the newest Mojo its host dependency
# allows -- not with whatever the consumer pinned. From 0.2.0 this package
# is Mojo 1.2 only. 1.2 is a nightly series today, so the bound names the
# nightly this release was built and tested against.
[package]
name = "dataframe_mojo"
version = "0.2.0"
description = "An experimental dataframe library for Mojo"
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = ">=0.2.7,<1" }
source = { path = "." }

[package.build.config.pkg]
name = "dataframe"
path = "dataframe"

[package.host-dependencies]
mojo = ">=1.2.0.dev2026092105,<1.3"

[package.run-dependencies]
mojo = ">=1.2.0.dev2026092105,<1.3"

[dependencies]
# What CI runs, matching the package's host and run dependencies above.
mojo = ">=1.2.0.dev2026092105,<1.3"

[tasks]
test = "bash scripts/run_tests.sh"
check-version = "python3 scripts/check_version.py"
example = "mojo run -I . examples/sales.mojo && mojo run -I . examples/expressions.mojo && mojo run -I . examples/read_csv.mojo"
format = "mblack --target-version mojo --line-length 80 dataframe tests examples benchmarks"
format-check = "mblack --check --target-version mojo --line-length 80 dataframe tests examples benchmarks"
build = "mkdir -p build && mojo build -I . examples/sales.mojo -o build/sales && mojo build -I . examples/expressions.mojo -o build/expressions && mojo build -I . examples/read_csv.mojo -o build/read_csv"
bench-csv = "mojo run -I . benchmarks/bench_csv.mojo"
bench = "mojo run -I . benchmarks/bench_suite.mojo"
bench-smoke = "BENCH_SMOKE=1 mojo run -I . benchmarks/bench_suite.mojo"
package = "mkdir -p dist && mojo precompile dataframe -o dist/dataframe.mojoc"
package-smoke = "bash scripts/package_smoke.sh"
docs = "mkdir -p build && mojo doc dataframe -o build/api.json && python3 scripts/api_docs.py build/api.json docs/api.md"
docs-check = "mkdir -p build && mojo doc dataframe -o build/api.json && python3 scripts/api_docs.py build/api.json --check"
bench-concat = "mojo run -I . benchmarks/bench_concat.mojo"
bench-sort = "mojo run -I . benchmarks/bench_sort.mojo"
bench-group-by = "mojo run -I . benchmarks/bench_group_by.mojo"
bench-join = "mojo run -I . benchmarks/bench_join.mojo"
bench-joins-polars = "python3 scripts/bench_join_polars.py"

[feature.oracle.dependencies]
polars = ">=1.0"
pyarrow = ">=15"
python = ">=3.11"

[feature.oracle.tasks]
oracle = "python3 scripts/oracle.py"
oracle-arrow = "mojo run -I . tests/oracle/arrow_pyarrow.mojo"
bench-polars = "python3 scripts/bench_polars.py"

[environments]
oracle = { features = ["oracle"], solve-group = "default" }
