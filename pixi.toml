[workspace]
name = "dataframe_mojo"
version = "0.2.0"
description = "An experimental dataframe library for Mojo"
channels = [
    "https://conda.modular.com/max-nightly",
    "https://conda.modular.com/max",
    "conda-forge",
    "https://prefix.dev/pixi-build-backends",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

# Installable as a Mojo package straight from GitHub. Consumers add, for
# example:
#
#     [dependencies]
#     dataframe_mojo = { git = "https://github.com/randyzwitch/dataframe_mojo.git", tag = "v0.2.0" }
#     mojo = ">=1.2,<1.3"
#
# and then `from dataframe import DataFrame, col`.
#
# A compiled Mojo package only loads in the Mojo version that produced it,
# and pixi builds this package with the newest Mojo its host dependency
# allows -- not with whatever the consumer pinned. From 0.2.0 this package
# is Mojo 1.2 only. 1.2 is a nightly series today, so the bound names the
# nightly this release was built and tested against.
[package]
name = "dataframe_mojo"
version = "0.2.0"
description = "An experimental dataframe library for Mojo"
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = ">=0.2.7,<1" }
source = { path = "." }

[package.build.config.pkg]
name = "dataframe"
path = "dataframe"

[package.host-dependencies]
mojo = ">=1.2.0.dev2026092105,<1.3"

[package.run-dependencies]
mojo = ">=1.2.0.dev2026092105,<1.3"

[dependencies]
# What CI runs, matching the package's host and run dependencies above.
mojo = ">=1.2.0.dev2026092105,<1.3"

[tasks]
test = "bash scripts/run_tests.sh"
check-version = "python3 scripts/check_version.py"
example = "mojo run -I . examples/sales.mojo && mojo run -I . examples/expressions.mojo && mojo run -I . examples/read_csv.mojo"
format = "mblack --target-version mojo --line-length 80 dataframe dataframe_accel tests examples benchmarks"
format-check = "mblack --check --target-version mojo --line-length 80 dataframe dataframe_accel tests examples benchmarks"
build = "mkdir -p build && mojo build -I . examples/sales.mojo -o build/sales && mojo build -I . examples/expressions.mojo -o build/expressions && mojo build -I . examples/read_csv.mojo -o build/read_csv"
bench-csv = "mojo run -I . benchmarks/bench_csv.mojo"
bench = "mojo run -I . benchmarks/bench_suite.mojo"
bench-smoke = "BENCH_SMOKE=1 mojo run -I . benchmarks/bench_suite.mojo"
package = "mkdir -p dist && mojo precompile dataframe -o dist/dataframe.mojoc"
package-smoke = "bash scripts/package_smoke.sh"
docs = "mkdir -p build && mojo doc dataframe -o build/api.json && python3 scripts/api_docs.py build/api.json docs/api.md"
docs-check = "mkdir -p build && mojo doc dataframe -o build/api.json && python3 scripts/api_docs.py build/api.json --check"
bench-concat = "mojo run -I . benchmarks/bench_concat.mojo"
bench-sort = "mojo run -I . benchmarks/bench_sort.mojo"
bench-group-by = "mojo run -I . benchmarks/bench_group_by.mojo"
bench-join = "mojo run -I . benchmarks/bench_join.mojo"
bench-joins-polars = "python3 scripts/bench_join_polars.py"
bench-joins-duckdb = "python3 scripts/bench_join_duckdb.py"

[feature.oracle.dependencies]
polars = ">=1.0"
pyarrow = ">=15"
python = ">=3.11"

[feature.oracle.tasks]
oracle = "python3 scripts/oracle.py"
oracle-arrow = "mojo run -I . tests/oracle/arrow_pyarrow.mojo && mojo run -I . tests/oracle/arrow_metadata.mojo"
oracle-arrow-metadata = "mojo run -I . tests/oracle/arrow_metadata.mojo"
oracle-geospatial = "python3 scripts/check_geospatial.py"
oracle-geometry = "python3 scripts/check_geometry_accessors.py"
oracle-duckdb-spatial = "python3 scripts/check_duckdb_spatial.py"
oracle-geoparquet = "python3 scripts/check_geoparquet.py"
oracle-shapefile = "python3 scripts/check_shapefile.py"
oracle-asof = "python3 scripts/check_asof.py"
oracle-time-windows = "mojo run -I . tests/oracle/time_windows.mojo"
bench-suites = "python3 scripts/bench_suites.py"

[feature.oracle.pypi-dependencies]
duckdb = ">=1.5.5, <2"
geopandas = ">=1.1, <2"
shapely = ">=2.1, <3"

# Builds libdfparquet, the Parquet reader library read_parquet loads at run
# time (see native/dfparquet). Needs a C++20 compiler on the host.
[feature.native.dependencies]
cmake = ">=3.25"
ninja = ">=1.11"

[feature.native.tasks]
build-dfparquet = "bash native/dfparquet/build.sh build/dfparquet"

[environments]
oracle = { features = ["oracle"], solve-group = "default" }
native = { features = ["native"], solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "gpu" }

# Optional NVIDIA feasibility benchmark; never a package/runtime dependency.
# max-core supplies the Mojo accelerator library without the Python MAX API.
[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.dependencies]
mojo = "==1.2.0.dev2026092105"
max-core = "==26.7.0.dev2026092105"

[feature.gpu.tasks]
build-gpu-feasibility = "mkdir -p build && mojo build -I . benchmarks/bench_gpu_feasibility.mojo -o build/bench_gpu_feasibility"
bench-gpu-feasibility = { cmd = "./build/bench_gpu_feasibility", depends-on = ["build-gpu-feasibility"] }
test-gpu-feasibility = { cmd = "./build/bench_gpu_feasibility --check", depends-on = ["build-gpu-feasibility"] }
build-nvidia-runtime-tests = "mkdir -p build && mojo build -I . tests/accel/test_nvidia_runtime.mojo -o build/test_nvidia_runtime"
test-nvidia-runtime = { cmd = "./build/test_nvidia_runtime", depends-on = ["build-nvidia-runtime-tests"] }

build-nvidia-query-tests = "mkdir -p build && mojo build -I . tests/accel/test_nvidia_query.mojo -o build/test_nvidia_query"
test-nvidia-query = { cmd = "./build/test_nvidia_query", depends-on = ["build-nvidia-query-tests"] }

package-nvidia = "python3 scripts/build_accel_package.py"
test-nvidia-package = { cmd = "python3 scripts/test_accel_package.py --package-dir dist/nvidia --provider nvidia", depends-on = ["package-nvidia"] }

build-nvidia-budget-tests = "mkdir -p build && mojo build -I . tests/accel/test_nvidia_budget.mojo -o build/test_nvidia_budget"
test-nvidia-budget = { cmd = "./build/test_nvidia_budget", depends-on = ["build-nvidia-budget-tests"] }

build-nvidia-row-tests = "mkdir -p build && mojo build -I . tests/accel/test_nvidia_rows.mojo -o build/test_nvidia_rows"
test-nvidia-rows = { cmd = "./build/test_nvidia_rows", depends-on = ["build-nvidia-row-tests"] }
