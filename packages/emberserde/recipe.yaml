# Compile the upstream source with the same compiler as dataframe_mojo.
# Update this pin with pixi.toml; .mojoc files are compiler-version specific.
# The patch only adapts removed Mojo APIs. Drop it once the pinned upstream
# revision supports our compiler; the JSON grammar stays upstream-owned.
package:
  name: emberserde
  version: 0.2.0
source:
  git: https://github.com/bgreni/EmberSerde.git
  rev: 8a5cde9bb7e838cf1e8e6b753c5594ed612f2aa9
  patches:
    - mojo-nightly.patch
build:
  number: 0
  script:
    - mkdir -p "$PREFIX/lib/mojo"
    - mojo precompile -I "$PREFIX/lib/mojo" emberserde -o "$PREFIX/lib/mojo/emberserde.mojoc"
requirements:
  host:
    - mojo-compiler ==1.3.0.dev2026111005
  run:
    - mojo-compiler ==1.3.0.dev2026111005
about:
  homepage: https://github.com/bgreni/EmberSerde
  license: Apache-2.0
  license_file: LICENSE
  summary: emberserde pinned for dataframe_mojo's compiler
