context:
  mojo: "1.3.0.dev2026112405"
  max_core: "26.8.0.dev2026112405"

package:
  name: dataframe_mojo
  version: "0.3.0"

source:
  path: ..

build:
  script: python scripts/build_package.py --modules-only --output "$PREFIX/lib/mojo"

requirements:
  build:
    - python >=3.10
  host:
    - mojo ==${{ mojo }}
    - max-core ==${{ max_core }}
    - regex_mojo
    - unicode_mojo
    - emberjson
  run:
    - mojo ==${{ mojo }}
    - max-core ==${{ max_core }}
    - regex_mojo
    - unicode_mojo
    - emberjson

about:
  license: MIT
  license_file: LICENSE
